name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
      
      # 1. Cambia la configuración para GitHub Pages
      - name: Update Vite Config for GitHub Pages
        run: |
          sed -i "s/plugins: \[react(), tailwindcss(), VitePWA/base: '\/${{ github.event.repository.name }}\/',\n    plugins: \[react(), tailwindcss(), VitePWA/" vite.config.ts
          
      - name: Install Dependencies
        run: npm install
        
      - name: Build Application
        run: npm run build
        
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
